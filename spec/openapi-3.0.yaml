  /v1/image/upscale:
    post:
      description: Upload a JPEG, PNG, or static WebP image to enlarge it by 2× or 4× (4× by default). Send the image in the `file` field of a multipart form; you can also include `webhook_url` and `webhook_token`. The request waits for processing to finish, then returns the completed task. `data.result.output` contains a PNG download URL in `file_url`, along with details such as the output dimensions and file size. The result can be downloaded for 24 hours after it is created, and `readable_until` tells you when that window closes.
      operationId: UpscaleImage
      parameters:
        - in: query
          name: outscale
          schema:
            default: "4"
            enum:
              - "2"
              - "4"
            type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              additionalProperties: false
              properties:
                file:
                  contentMediaType: application/octet-stream
                  format: binary
                  type: string
                webhook_token:
                  maxLength: 512
                  type: string
                webhook_url:
                  format: uri
                  maxLength: 1000
                  type: string
              required:
                - file
              type: object
        description: JPEG, PNG, or static WebP; maximum 32 MiB.
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  data:
                    $ref: "#/components/schemas/TaskView"
                  request_id:
                    type: string
                required:
                  - data
                  - request_id
                type: object
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                additionalProperties: false
                properties:
                  code:
                    type: string
                  detail:
                    type: string
                  request_id:
                    type: string
                  status:
                    format: int64
                    type: integer
                  task_id:
                    type: string
                  title:
                    type: string
                required:
                  - status
                  - code
                  - request_id
                type: object
          description: Stable Huma-compatible error envelope.
      security:
        - BearerAuth: []
      summary: Upscale an image
      tags:
        - Image
  /v1/image/upscale/{task_id}:
    get:
      description: Retrieve an image upscale task using the `task_id` returned by the upscale request. The response shows the task status and its settings. For a completed task, `data.result.output` contains the PNG download URL and output details. The result can be downloaded for 24 hours after it is created, and `readable_until` tells you when that window closes.
      operationId: GetImageUpscaleTask
      parameters:
        - description: GTai image upscale task ID
          in: path
          name: task_id
          required: true
          schema:
            description: GTai image upscale task ID
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
          description: OK
          headers:
            Cache-Control:
              schema:
                type: string
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "410":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Gone
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - BearerAuth: []
      summary: Get an image upscale task
      tags:
        - Image
