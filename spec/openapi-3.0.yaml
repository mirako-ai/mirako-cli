          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - BearerAuth: []
      summary: Get talking avatar task status
      tags:
        - Video
  /v1/video/upscale:
    post:
      description: Upload an MP4 video and start an upscale to 1080p, 2K, or 4K. Billing has a five-second minimum and rounds longer verified output durations up to the next whole second. Send the video in the `file` field of a multipart form, choose the target with the required `resolution` query parameter, and optionally include `webhook_url` and `webhook_token`. The response contains a task ID, the current status, and a status URL to poll while the video is processed. When the task is complete, `data.result.output` contains an MP4 download URL in `file_url` and video details such as its dimensions, duration, and frame rate. The result can be downloaded for 24 hours after it is created, and `readable_until` tells you when that window closes.
      operationId: UpscaleVideo
      parameters:
        - in: query
          name: resolution
          required: true
          schema:
            enum:
              - 1080p
              - 2k
              - 4k
            type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              additionalProperties: false
              properties:
                file:
                  contentMediaType: application/octet-stream
                  format: binary
                  type: string
                webhook_token:
                  maxLength: 512
                  type: string
                webhook_url:
                  format: uri
                  maxLength: 1000
                  type: string
              required:
                - file
              type: object
        description: MP4; maximum 1 GiB. The backend validates the documented H.264/AAC profile.
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  data:
                    $ref: "#/components/schemas/TaskView"
                  request_id:
                    type: string
                required:
                  - data
                  - request_id
                type: object
          description: Accepted
        default:
          content:
            application/problem+json:
              schema:
                additionalProperties: false
                properties:
                  code:
                    type: string
                  detail:
                    type: string
                  request_id:
                    type: string
                  status:
                    format: int64
                    type: integer
                  task_id:
                    type: string
                  title:
                    type: string
                required:
                  - status
                  - code
                  - request_id
                type: object
          description: Stable Huma-compatible error envelope.
      security:
        - BearerAuth: []
      summary: Upscale a video
      tags:
        - Video
