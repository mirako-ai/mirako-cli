          description: Runtime kind for this agent
          enum:
            - managed_agent
            - custom_agent
          example: managed_agent
          type: string
        tools:
          description: Tool definitions available to managed agents
          example: []
          items: {}
          type: array
        voice_profile_id:
          description: Voice profile used by the agent
          example: a1b2c3d4-e5f6-7890-1234-567890abcdef
          type: string
      type: object
    UpdateAgentRouteApiResponseBody:
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/AgentRouteResponse"
          description: Updated agent route
      required:
        - data
      type: object
    UpdateAgentRouteInput:
      additionalProperties: false
      properties:
        label:
          description: Required owner-facing label update. Use null to clear it.
          example: Production website
          maxLength: 100
          nullable: true
          type: string
      required:
        - label
      type: object
    Webhook:
      additionalProperties: false
      properties:
        auth_token:
          description: "Auth token used to authenticate the webhook via 'Authorization: Bearer' header"
          example: secure_token_for_webhook
          type: string
        url:
          description: Webhook URL to receive the async task status
          example: https://my-ai-service.com/webhook
          type: string
      required:
        - url
      type: object
  securitySchemes:
    BearerAuth:
      bearerFormat: api token
      description: Bearer token authentication using OAuth 2.0 API tokens
      in: header
      scheme: bearer
      type: http
info:
  title: Mirako API
  version: 1.0.0
openapi: 3.0.3
paths:
